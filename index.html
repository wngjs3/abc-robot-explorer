<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ABC Robot Explorer</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="gate" class="hidden">
  <form id="gate-form">
    <input id="gate-token" type="password" placeholder="hf_…" autocomplete="off" spellcheck="false">
    <button>저장</button>
    <p id="gate-error"></p>
  </form>
</div>
<header id="top" class="hidden">
  <a href="#/" class="brand">ABC-130k</a>
  <nav id="splits"></nav>
  <div class="tools">
    <input id="search" type="search" placeholder="검색">
    <select id="sort">
      <option value="hours">hours</option>
      <option value="episodes">episodes</option>
      <option value="annotated">annotated %</option>
      <option value="avg">min / ep</option>
      <option value="name">name</option>
    </select>
    <button id="view-toggle" title="표 / 그리드"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
    <button id="logout" title="토큰 삭제"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
  </div>
</header>
<main id="main" class="hidden">
  <section id="stats"></section>
  <section id="tasks"></section>
  <section id="task" class="hidden">
    <div class="task-head">
      <a id="back" href="#/">←</a>
      <h1 id="task-title"></h1>
      <span id="task-meta"></span>
      <a id="task-hf" target="_blank" rel="noreferrer">HF ↗</a>
    </div>
    <div id="episodes" class="grid"></div>
    <div id="sentinel"></div>
  </section>
  <p id="message"></p>
</main>
<dialog id="player">
  <div class="pv-head">
    <div class="pv-titles">
      <h2 id="pv-title"></h2>
      <code id="pv-id"></code>
      <p id="pv-instruction"></p>
    </div>
    <div class="pv-actions">
      <span id="pv-status"></span>
      <button id="pv-prev" title="이전 (↑)">↑</button>
      <button id="pv-next" title="다음 (↓)">↓</button>
      <button id="pv-close" title="닫기 (Esc)">✕</button>
    </div>
  </div>
  <div id="pv-cams"></div>
  <div class="pv-bar">
    <button id="pv-play">▶</button>
    <span id="pv-time">0:00</span>
    <div class="pv-track"><canvas id="pv-loaded" height="4"></canvas><input id="pv-seek" type="range" min="0" step="0.01" value="0"></div>
    <span id="pv-total">0:00</span>
    <select id="pv-speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
  </div>
  <div class="pv-charts">
    <div><span>left</span><canvas id="pv-chart-left"></canvas></div>
    <div><span>right</span><canvas id="pv-chart-right"></canvas></div>
  </div>
</dialog>
</body>
</html>
